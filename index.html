<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>LOW CG</title>
<style>
  :root{
    --paper: #eef2e9;
    --paper-line: #cfd8c3;
    --margin-red: #b23a48;
    --ink: #1f3a5f;
    --ink-soft: #4a5d78;
    --gold: #b8901f;
    --green: #2f6d4f;
    --red: #b23a48;
    --card: #f6f8f2;
    --shadow: 0 2px 10px rgba(31,58,95,0.08);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background: var(--paper);
    background-image:
      repeating-linear-gradient(var(--paper) 0px, var(--paper) 27px, var(--paper-line) 28px);
    font-family: 'Georgia', 'Noto Serif', serif;
    color: var(--ink);
    padding: 0;
  }
  .wrap{
    max-width: 760px;
    margin: 0 auto;
    padding: 28px 24px 80px 44px;
    position: relative;
  }
  .wrap::before{
    content:"";
    position:absolute;
    top:0; bottom:0; left:26px;
    width:2px;
    background: var(--margin-red);
    opacity:0.55;
  }
  header{
    margin-bottom: 22px;
  }
  h1{
    font-family: 'Georgia', serif;
    font-size: 30px;
    letter-spacing: 0.5px;
    margin: 0 0 2px 0;
    color: var(--ink);
  }
  .sub{
    font-family: 'IBM Plex Mono', 'Courier New', monospace;
    font-size: 12.5px;
    color: var(--ink-soft);
    text-transform: uppercase;
    letter-spacing: 1.2px;
  }
  .names{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--gold);
    margin-top: 6px;
    letter-spacing: 0.5px;
  }

  section{ margin-bottom: 30px; }
  h2{
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--ink-soft);
    border-bottom: 1px solid var(--paper-line);
    padding-bottom: 6px;
    margin: 0 0 14px 0;
  }

  .balances{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(150px,1fr));
    gap: 10px;
  }
  .bcard{
    background: var(--card);
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    padding: 10px 12px;
    box-shadow: var(--shadow);
  }
  .bname{
    font-weight: bold;
    font-size: 14px;
  }
  .bamt{
    font-family:'IBM Plex Mono', monospace;
    font-size: 15px;
    margin-top: 4px;
  }
  .owed{ color: var(--green); }
  .owes{ color: var(--red); }
  .even{ color: var(--ink-soft); }
  .btag{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    color: var(--ink-soft);
  }

  .quickrow{ display:flex; gap:10px; margin-bottom:14px; flex-wrap: wrap; }
  .quickbtn{
    font-family:'IBM Plex Mono', monospace;
    font-size: 12.5px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 3px;
    padding: 9px 14px;
    cursor: pointer;
  }
  .quickbtn:hover{ background: var(--ink-soft); }

  form{
    background: var(--card);
    border: 1px solid var(--paper-line);
    border-radius: 4px;
    padding: 16px;
    box-shadow: var(--shadow);
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  form label{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    text-transform: uppercase;
    color: var(--ink-soft);
    display:block;
    margin-bottom: 3px;
  }
  form input, form select{
    width:100%;
    font-family: 'Georgia', serif;
    font-size: 14px;
    padding: 7px 8px;
    border: 1px solid var(--paper-line);
    border-radius: 3px;
    background: #fff;
    color: var(--ink);
  }
  .full{ grid-column: 1 / -1; }
  .submitbtn{
    font-family:'IBM Plex Mono', monospace;
    background: var(--margin-red);
    color: #fff;
    border:none;
    border-radius: 3px;
    padding: 10px;
    font-size: 13px;
    letter-spacing: 0.5px;
    cursor: pointer;
    text-transform: uppercase;
  }
  .submitbtn:hover{ opacity:0.9; }

  .settle-list{ display:flex; flex-direction:column; gap:8px; }
  .settle-item{
    font-family:'IBM Plex Mono', monospace;
    font-size: 13.5px;
    background: var(--card);
    border-left: 3px solid var(--gold);
    padding: 9px 12px;
    border-radius: 2px;
  }
  .settle-item b{ color: var(--ink); }
  .all-settled{
    font-family:'IBM Plex Mono', monospace;
    color: var(--green);
    font-size: 13px;
  }

  table{ width:100%; border-collapse: collapse; }
  th{
    font-family:'IBM Plex Mono', monospace;
    font-size: 10.5px;
    text-transform: uppercase;
    color: var(--ink-soft);
    text-align: left;
    border-bottom: 1px solid var(--paper-line);
    padding: 6px 4px;
  }
  td{
    font-size: 13.5px;
    padding: 7px 4px;
    border-bottom: 1px solid var(--paper-line);
  }
  td.amt, th.amt{ font-family:'IBM Plex Mono', monospace; text-align:right; }
  .delbtn{
    background:none; border:none; color: var(--red);
    cursor:pointer; font-family:'IBM Plex Mono', monospace;
    font-size: 12px;
  }
  .empty{
    font-family:'IBM Plex Mono', monospace;
    color: var(--ink-soft);
    font-size: 13px;
    padding: 10px 0;
  }
  .status{
    font-family:'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--ink-soft);
    margin-top: 4px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>মেস খাতা</h1>
    <div class="sub">Shared Mess Ledger</div>
    <div class="names">ALVE · SAIKAT · SALMAN · ABTAHI · EMON · TANVIR</div>
  </header>

  <section>
    <h2>Balances</h2>
    <div id="balances" class="balances"></div>
  </section>

  <section>
    <h2>Add a Payment</h2>
    <div class="quickrow">
      <button class="quickbtn" onclick="quickAdd('Rent', 11500)">+ Rent ৳11500</button>
      <button class="quickbtn" onclick="quickAdd('Wifi', 683)">+ Wifi ৳683</button>
      <button class="quickbtn" onclick="quickAdd('Water', '')">+ Water bill</button>
      <button class="quickbtn" onclick="quickAdd('Electricity', '')">+ Current bill</button>
    </div>
    <form id="entryForm" onsubmit="return handleSubmit(event)">
      <div>
        <label>Category</label>
        <select id="f-category">
          <option>Rent</option>
          <option>Wifi</option>
          <option>Water</option>
          <option>Electricity</option>
          <option>Other</option>
        </select>
      </div>
      <div>
        <label>Amount (৳)</label>
        <input id="f-amount" type="number" step="0.01" min="0" required>
      </div>
      <div>
        <label>Paid by</label>
        <select id="f-paidby">
          <option>Emon</option>
          <option>Saikat</option>
          <option>Salman</option>
          <option>Abtahi</option>
          <option>Alve</option>
          <option>Tanvir</option>
          <option value="All">All (split on the spot)</option>
        </select>
      </div>
      <div>
        <label>Date</label>
        <input id="f-date" type="date">
      </div>
      <div class="full">
        <label>Note (optional)</label>
        <input id="f-note" type="text" placeholder="e.g. August water bill">
      </div>
      <div class="full">
        <button class="submitbtn" type="submit">Add to ledger — split 6 ways</button>
      </div>
    </form>
    <div id="status" class="status"></div>
  </section>

  <section>
    <h2>Settle Up</h2>
    <div id="settle" class="settle-list"></div>
  </section>

  <section>
    <h2>History</h2>
    <table>
      <thead>
        <tr><th>Date</th><th>Category</th><th>Note</th><th>Paid by</th><th class="amt">Amount</th><th></th></tr>
      </thead>
      <tbody id="history"></tbody>
    </table>
    <div id="emptyMsg" class="empty" style="display:none;">No entries yet. Add the first bill above.</div>
  </section>
</div>

<script>
const MEMBERS = ["Emon","Saikat","Salman","Abtahi","Alve","Tanvir"];
const STORE_KEY = "expenses";
let expenses = [];

function todayStr(){
  const d = new Date();
  return d.toISOString().slice(0,10);
}
document.getElementById('f-date').value = todayStr();

function quickAdd(category, amount){
  document.getElementById('f-category').value = category;
  if(amount !== '') document.getElementById('f-amount').value = amount;
  document.getElementById('f-amount').focus();
}

async function loadExpenses(){
  const statusEl = document.getElementById('status');
  try{
    const result = await window.storage.get(STORE_KEY, true);
    expenses = result && result.value ? JSON.parse(result.value) : [];
  }catch(e){
    expenses = [];
  }
  render();
}

async function saveExpenses(){
  try{
    const result = await window.storage.set(STORE_KEY, JSON.stringify(expenses), true);
    if(!result){
      document.getElementById('status').textContent = 'Could not save — try again.';
    }
  }catch(e){
    document.getElementById('status').textContent = 'Storage error — entry may not be saved.';
  }
}

function handleSubmit(ev){
  ev.preventDefault();
  const category = document.getElementById('f-category').value;
  const amount = parseFloat(document.getElementById('f-amount').value);
  const paidBy = document.getElementById('f-paidby').value;
  const date = document.getElementById('f-date').value || todayStr();
  const note = document.getElementById('f-note').value.trim();

  if(!amount || amount <= 0){
    document.getElementById('status').textContent = 'Enter a valid amount.';
    return false;
  }

  const entry = {
    id: Date.now().toString(36) + Math.random().toString(36).slice(2,7),
    category, amount, paidBy, date, note
  };
  expenses.push(entry);
  saveExpenses();
  render();

  document.getElementById('f-amount').value = '';
  document.getElementById('f-note').value = '';
  document.getElementById('status').textContent = `Added ৳${amount} (${category}) paid by ${paidBy}.`;
  return false;
}

async function deleteEntry(id){
  expenses = expenses.filter(e => e.id !== id);
  await saveExpenses();
  render();
}

function computeBalances(){
  const paid = {}, owed = {};
  MEMBERS.forEach(m => { paid[m] = 0; owed[m] = 0; });
  let total = 0;
  expenses.forEach(e => {
    if(e.paidBy === 'All'){
      const share = e.amount / 6;
      MEMBERS.forEach(m => paid[m] = (paid[m] || 0) + share);
    }else{
      paid[e.paidBy] = (paid[e.paidBy] || 0) + e.amount;
    }
    total += e.amount;
  });
  const share = total / 6;
  MEMBERS.forEach(m => owed[m] = share);
  const net = {};
  MEMBERS.forEach(m => net[m] = paid[m] - owed[m]);
  return net;
}

function simplifySettlements(net){
  const creditors = [], debtors = [];
  MEMBERS.forEach(m => {
    const v = Math.round(net[m] * 100) / 100;
    if(v > 0.5) creditors.push({name:m, amt:v});
    else if(v < -0.5) debtors.push({name:m, amt:-v});
  });
  creditors.sort((a,b)=>b.amt-a.amt);
  debtors.sort((a,b)=>b.amt-a.amt);
  const txns = [];
  let i=0, j=0;
  while(i < debtors.length && j < creditors.length){
    const d = debtors[i], c = creditors[j];
    const amt = Math.min(d.amt, c.amt);
    txns.push({from: d.name, to: c.name, amt: Math.round(amt)});
    d.amt -= amt; c.amt -= amt;
    if(d.amt < 0.5) i++;
    if(c.amt < 0.5) j++;
  }
  return txns;
}

function render(){
  const net = computeBalances();

  // balances
  const balEl = document.getElementById('balances');
  balEl.innerHTML = '';
  MEMBERS.forEach(m => {
    const v = net[m];
    const div = document.createElement('div');
    div.className = 'bcard';
    let cls = 'even', tag = 'settled up', amtStr = '৳0';
    if(v > 0.5){ cls='owed'; tag='is owed'; amtStr = '৳' + Math.round(v); }
    else if(v < -0.5){ cls='owes'; tag='owes the group'; amtStr = '৳' + Math.round(-v); }
    div.innerHTML = `<div class="bname">${m}</div><div class="btag">${tag}</div><div class="bamt ${cls}">${amtStr}</div>`;
    balEl.appendChild(div);
  });

  // settle up
  const settleEl = document.getElementById('settle');
  const txns = simplifySettlements(net);
  settleEl.innerHTML = '';
  if(txns.length === 0){
    settleEl.innerHTML = '<div class="all-settled">Everyone is settled up.</div>';
  }else{
    txns.forEach(t => {
      const div = document.createElement('div');
      div.className = 'settle-item';
      div.innerHTML = `<b>${t.from}</b> pays <b>${t.to}</b> — ৳${t.amt}`;
      settleEl.appendChild(div);
    });
  }

  // history
  const histEl = document.getElementById('history');
  histEl.innerHTML = '';
  const sorted = [...expenses].sort((a,b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  sorted.forEach(e => {
    const tr = document.createElement('tr');
    tr.innerHTML = `<td>${e.date}</td><td>${e.category}</td><td>${e.note || '—'}</td><td>${e.paidBy}</td><td class="amt">৳${e.amount}</td><td><button class="delbtn" onclick="deleteEntry('${e.id}')">remove</button></td>`;
    histEl.appendChild(tr);
  });
  document.getElementById('emptyMsg').style.display = expenses.length ? 'none' : 'block';
}

loadExpenses();
</script>
</body>
</html>
